<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} {{DATE}}</title>
<style>
/*CARD_VARS*/
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);
     color:var(--ink);max-width:720px;margin:0 auto;padding:24px 16px;line-height:1.6}
h1{font-size:20px;font-weight:600;margin:0 0 2px}
.date{color:var(--ink3);font-size:13px;margin-bottom:16px}
/*CARD_CSS*/
.foot{margin-top:28px;border-top:1px solid var(--rule);padding-top:12px}
/* 解析不了的卡片按旧版样式原样显示 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px}
.card .pill{background:var(--tagbg);color:var(--ink2);border-radius:12px;padding:2px 10px}
.card .meta a{color:var(--accent);text-decoration:none}
.card h2{font-size:16px;font-weight:600;margin:0 0 2px}
.card .en{color:var(--ink3);font-size:12px;margin-bottom:10px}
.card a.blk{display:block;text-decoration:none;color:inherit}
.card .q,.card .m,.card .res,.card .conc,.card .news{border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px;
     background:var(--tagbg);color:var(--ink)}
.card .m span,.card .res span{display:block;font-weight:400;font-size:12px;color:var(--ink2);margin-top:2px}
.card .term{font-size:12px;margin-top:8px}
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="date">{{DATE}}</div>
<!--CARDS-->
<div class="foot legend"><!--LEGEND--></div>
</body>
</html>

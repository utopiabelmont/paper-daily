name: Send daily digest

on:
  push:
    paths:
      - 'digests/*.md'
  workflow_dispatch:

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed ref
        uses: actions/checkout@v4

      - name: Pick the newest digest
        id: pick
        run: |
          FILE=$(ls -1 digests/*.md 2>/dev/null | sort | tail -n 1)
          if [ -z "$FILE" ]; then
            echo "没有找到 digests/*.md，退出。"
            exit 1
          fi
          DATE=$(basename "$FILE" .md)
          HTML="digests_html/${DATE}.html"
          if [ -f "$HTML" ]; then ATT="$FILE,$HTML"; else ATT="$FILE"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "html=$HTML" >> "$GITHUB_OUTPUT"
          echo "att=$ATT" >> "$GITHUB_OUTPUT"
          {
            echo "BODY<<__EOF__"
            cat "$FILE"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build HTML email body
        run: |
          # 图卡排进邮件正文，样式内联；失败时退回把文字版原样放进正文，保证邮件照常发出
          pip install --quiet premailer || echo "premailer 安装失败，正文只保留 <style> 样式"
          python build_email.py "${{ steps.pick.outputs.file }}" "${{ steps.pick.outputs.html }}" email.html \
            || python -c "import html,sys; open('email.html','w',encoding='utf-8').write('<pre style=\"white-space:pre-wrap;font-family:sans-serif\">'+html.escape(open(sys.argv[1],encoding='utf-8').read())+'</pre>')" "${{ steps.pick.outputs.file }}"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: 每日论文简报 ${{ steps.pick.outputs.date }}
          body: ${{ env.BODY }}
          html_body: file://email.html
          attachments: ${{ steps.pick.outputs.att }}
